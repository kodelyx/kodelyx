name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *" # every 12 hours
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Generate Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: kodelyx
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#6366f1&color_dots=#ebedf0,#c7d2fe,#a5b4fc,#818cf8,#6366f1
            dist/github-contribution-grid-snake-dark.svg?color_snake=#a5b4fc&color_dots=#161b22,#312e81,#4338ca,#6366f1,#a5b4fc
            dist/github-contribution-grid-snake.gif?color_snake=#6366f1&color_dots=#161b22,#312e81,#4338ca,#6366f1,#a5b4fc

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
